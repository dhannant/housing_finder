<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#0d0804"/>
      <circle cx="9" cy="9" r="0.7" fill="#180f06"/>
    </pattern>

    <!-- Shiny trace gradient — light source from top-left -->
    <linearGradient id="traceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4813a" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#8a4e18"   stop-opacity="1"/>
      <stop offset="100%" stop-color="#6b3a10"  stop-opacity="0.6"/>
    </linearGradient>

    <!-- Letter gradient -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff0d8"/>
      <stop offset="35%"  stop-color="#f0a850"/>
      <stop offset="100%" stop-color="#8a4e18"/>
    </linearGradient>

    <!-- Letter gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffd090" stop-opacity="0.0"/>
      <stop offset="35%"  stop-color="#ffd090" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#ffd090" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffd090" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Scanlines on letters -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="none"/>
      <line x1="0" y1="2" x2="1" y2="2" stroke="#0d0500" stroke-width="0.9" opacity="0.3"/>
    </pattern>

    <clipPath id="iconClip">
      <rect x="0" y="0" width="242" height="200"/>
    </clipPath>

    <style>
      .trace { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* Main traces — shiny colored */
      #t1 { stroke:#8a4e18; stroke-width:2;   stroke-dasharray:320; stroke-dashoffset:320; animation: draw 1.2s ease forwards 0.2s; }
      #t2 { stroke:#6b3a10; stroke-width:1.8; stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.9s ease forwards 0.5s; }
      #t3 { stroke:#8a4e18; stroke-width:2;   stroke-dasharray:220; stroke-dashoffset:220; animation: draw 1.0s ease forwards 0.7s; }
      #t4 { stroke:#6b3a10; stroke-width:2;   stroke-dasharray:420; stroke-dashoffset:420; animation: draw 1.4s ease forwards 0.3s; }
      #t5 { stroke:#d4813a; stroke-width:1.8; stroke-dasharray:260; stroke-dashoffset:260; animation: draw 1.1s ease forwards 0.9s; }
      #t6 { stroke:#8a4e18; stroke-width:1.8; stroke-dasharray:380; stroke-dashoffset:380; animation: draw 1.3s ease forwards 0.6s; }
      #t7 { stroke:#6b3a10; stroke-width:2;   stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.8s ease forwards 1.1s; }
      #t8 { stroke:#d4813a; stroke-width:1.6; stroke-dasharray:120; stroke-dashoffset:120; animation: draw 0.7s ease forwards 1.3s; }
      #t9 { stroke:#8a4e18; stroke-width:1.8; stroke-dasharray:300; stroke-dashoffset:300; animation: draw 1.1s ease forwards 0.4s; }

      /* Overlay traces — darker to contrast with letters */
      #o1 { stroke:#3a1a06; stroke-width:2.0; stroke-dasharray:200; stroke-dashoffset:200; animation: draw 0.9s ease forwards 1.6s; }
      #o2 { stroke:#3a1a06; stroke-width:1.8; stroke-dasharray:200; stroke-dashoffset:200; animation: draw 0.9s ease forwards 1.8s; }
      #o3 { stroke:#3a1a06; stroke-width:1.8; stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.8s ease forwards 2.0s; }
      #o4 { stroke:#3a1a06; stroke-width:1.7; stroke-dasharray:220; stroke-dashoffset:220; animation: draw 0.9s ease forwards 2.1s; }
      #o5 { stroke:#3a1a06; stroke-width:1.8; stroke-dasharray:110; stroke-dashoffset:110; animation: draw 0.6s ease forwards 2.3s; }
      #o6 { stroke:#3a1a06; stroke-width:1.7; stroke-dasharray:560; stroke-dashoffset:560; animation: draw 1.4s ease forwards 2.2s; }

      @keyframes draw { to { stroke-dashoffset: 0; } }

      .node { opacity: 0; animation: fadeIn 0.3s ease forwards; }
      .n1  { animation-delay: 1.35s; } .n2  { animation-delay: 1.40s; }
      .n3  { animation-delay: 0.65s; } .n4  { animation-delay: 0.85s; }
      .n5  { animation-delay: 1.05s; } .n6  { animation-delay: 0.75s; }
      .n7  { animation-delay: 0.95s; } .n8  { animation-delay: 1.10s; }
      .n9  { animation-delay: 0.50s; } .n10 { animation-delay: 1.25s; }
      .n11 { animation-delay: 0.95s; } .n12 { animation-delay: 1.45s; }
      .n13 { animation-delay: 1.25s; } .n14 { animation-delay: 1.50s; }
      .n15 { animation-delay: 1.60s; } .n16 { animation-delay: 1.80s; }
      .n17 { animation-delay: 2.10s; } .n18 { animation-delay: 2.20s; }
      .n19 { animation-delay: 2.35s; } .n20 { animation-delay: 2.45s; }

      @keyframes fadeIn { to { opacity: 1; } }

      .letter    { opacity: 0; animation: fadeIn 0.5s ease forwards 1.5s; }
      .solutions { opacity: 0; animation: fadeIn 0.6s ease forwards 2.6s; }
      .rtext1    { opacity: 0; animation: slideIn 0.5s ease forwards 2.8s; }
      .rtext2    { opacity: 0; animation: slideIn 0.5s ease forwards 3.0s; }
      .rtext3    { opacity: 0; animation: slideIn 0.5s ease forwards 3.2s; }
      .rtext4    { opacity: 0; animation: slideIn 0.5s ease forwards 3.4s; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(8px); }
        to   { opacity: 1; transform: translateX(0);  }
      }

      .bin { font-family: monospace; font-size: 7px; letter-spacing: 1px; fill: #4a2808; }
      .bin1  { animation: blink 3.1s infinite 0.0s; }
      .bin2  { animation: blink 2.7s infinite 0.4s; }
      .bin3  { animation: blink 3.5s infinite 0.8s; }
      .bin4  { animation: blink 2.3s infinite 0.2s; }
      .bin5  { animation: blink 3.8s infinite 1.1s; }
      .bin6  { animation: blink 2.9s infinite 0.6s; }
      .bin7  { animation: blink 3.2s infinite 0.3s; }
      .bin8  { animation: blink 2.6s infinite 0.9s; }
      .bin9  { animation: blink 3.6s infinite 0.1s; }
      .bin10 { animation: blink 2.4s infinite 0.7s; }
      .bin11 { animation: blink 3.3s infinite 1.2s; }
      .bin12 { animation: blink 2.8s infinite 0.5s; }
      .bin13 { animation: blink 3.7s infinite 0.3s; }
      .bin14 { animation: blink 2.5s infinite 1.0s; }
      .bin15 { animation: blink 3.0s infinite 0.8s; }
      .bin16 { animation: blink 2.2s infinite 0.2s; }
      @keyframes blink {
        0%   { fill: #4a2808; }
        45%  { fill: #4a2808; }
        50%  { fill: #c06820; }
        52%  { fill: #4a2808; }
        80%  { fill: #4a2808; }
        85%  { fill: #c06820; opacity: 0.7; }
        87%  { fill: #4a2808; }
        100% { fill: #4a2808; }
      }

      .divider { opacity: 0; animation: fadeIn 0.4s ease forwards 2.5s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="560" height="200" fill="#0d0804"/>
  <rect width="242" height="200" fill="url(#dotgrid)" clip-path="url(#iconClip)"/>

  <!-- PCB TRACES -->
  <g clip-path="url(#iconClip)">
    <polyline id="t1" class="trace" points="0,160  40,160  55,145  100,145  115,130  242,130"/>
    <polyline id="t2" class="trace" points="0,30   30,30   45,45   45,70   60,85   60,95"/>
    <polyline id="t3" class="trace" points="65,0   65,15   80,30   160,30   175,45   175,65"/>
    <polyline id="t4" class="trace" points="242,170  210,170  195,185  140,185  125,170  60,170  45,155  45,140"/>
    <polyline id="t5" class="trace" points="10,0   10,40   25,55   25,90   10,105  10,200"/>
    <polyline id="t6" class="trace" points="85,0   85,20   100,35  100,55  115,70  115,90  100,105  100,130  85,145  85,200"/>
    <polyline id="t7" class="trace" points="220,0   220,25   205,40   205,60   220,75   242,75"/>
    <polyline id="t8" class="trace" points="130,55  145,55  160,70  190,70"/>
    <polyline id="t9" class="trace" points="0,100  20,100  35,85  35,60  50,45  130,45  145,30  242,30"/>

    <!-- Component stubs -->
    <line x1="30"  y1="108" x2="30"  y2="118" stroke="#8a4e18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.4s"/></line>
    <line x1="38"  y1="108" x2="38"  y2="118" stroke="#8a4e18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.45s"/></line>
    <line x1="155" y1="152" x2="155" y2="162" stroke="#8a4e18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.55s"/></line>
    <line x1="163" y1="152" x2="163" y2="162" stroke="#8a4e18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.60s"/></line>
    <line x1="195" y1="108" x2="205" y2="108" stroke="#d4813a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.65s"/></line>
    <line x1="195" y1="116" x2="205" y2="116" stroke="#d4813a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10" stroke-dashoffset="10"><animate attributeName="stroke-dashoffset" to="0" dur="0.3s" fill="freeze" begin="1.70s"/></line>

    <!-- Nodes -->
    <circle class="node n1"  cx="40"  cy="160" r="3.5" fill="#3d2008" stroke="#d4813a" stroke-width="1.2"/>
    <circle class="node n2"  cx="100" cy="145" r="3.5" fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n3"  cx="175" cy="130" r="3"   fill="#3d2008" stroke="#8a4e18"   stroke-width="1.5"/>
    <circle class="node n4"  cx="30"  cy="30"  r="3"   fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n5"  cx="45"  cy="70"  r="3.5" fill="#3d2008" stroke="#d4813a" stroke-width="1.2"/>
    <circle class="node n6"  cx="65"  cy="15"  r="3"   fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n7"  cx="160" cy="30"  r="3.5" fill="#3d2008" stroke="#d4813a" stroke-width="1.2"/>
    <circle class="node n8"  cx="175" cy="65"  r="3"   fill="#3d2008" stroke="#8a4e18"   stroke-width="1.5"/>
    <circle class="node n9"  cx="210" cy="170" r="3.5" fill="#3d2008" stroke="#6b3a10"  stroke-width="1.2"/>
    <circle class="node n10" cx="60"  cy="170" r="3.5" fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n11" cx="25"  cy="55"  r="3.5" fill="#3d2008" stroke="#d4813a" stroke-width="1.2"/>
    <circle class="node n12" cx="85"  cy="20"  r="3"   fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n13" cx="100" cy="55"  r="3.5" fill="#3d2008" stroke="#6b3a10"  stroke-width="1.2"/>
    <circle class="node n14" cx="205" cy="40"  r="3.5" fill="#3d2008" stroke="#8a4e18"   stroke-width="1.2"/>
    <circle class="node n15" cx="130" cy="55"  r="3"   fill="#3d2008" stroke="#d4813a" stroke-width="1.2"/>
  </g>

  <!-- LETTERS -->
  <g class="letter">
    <!-- H -->
    <rect x="14"  y="30" width="15" height="140" fill="url(#letterGrad)" rx="1.5"/>
    <rect x="73"  y="30" width="15" height="140" fill="url(#letterGrad)" rx="1.5"/>
    <rect x="29"  y="86" width="59" height="15"  fill="url(#letterGrad)" rx="1.5"/>
    <!-- I -->
    <rect x="95"  y="30"  width="36" height="13" fill="url(#letterGrad)" rx="1.5"/>
    <rect x="108" y="43"  width="10" height="114" fill="url(#letterGrad)" rx="1.5"/>
    <rect x="95"  y="157" width="36" height="13" fill="url(#letterGrad)" rx="1.5"/>
    <!-- T -->
    <rect x="139" y="30"  width="84" height="13" fill="url(#letterGrad)" rx="1.5"/>
    <rect x="174" y="43"  width="14" height="127" fill="url(#letterGrad)" rx="1.5"/>
    <!-- Scanlines -->
    <rect x="14"  y="30" width="15" height="140" fill="url(#scanlines)" rx="1.5"/>
    <rect x="73"  y="30" width="15" height="140" fill="url(#scanlines)" rx="1.5"/>
    <rect x="29"  y="86" width="59" height="15"  fill="url(#scanlines)" rx="1.5"/>
    <rect x="95"  y="30"  width="36" height="13" fill="url(#scanlines)" rx="1.5"/>
    <rect x="108" y="43"  width="10" height="114" fill="url(#scanlines)" rx="1.5"/>
    <rect x="95"  y="157" width="36" height="13" fill="url(#scanlines)" rx="1.5"/>
    <rect x="139" y="30"  width="84" height="13" fill="url(#scanlines)" rx="1.5"/>
    <rect x="174" y="43"  width="14" height="127" fill="url(#scanlines)" rx="1.5"/>
    <!-- Gloss -->
    <rect x="14"  y="30" width="15" height="140" fill="url(#gloss)" rx="1.5"/>
    <rect x="73"  y="30" width="15" height="140" fill="url(#gloss)" rx="1.5"/>
    <rect x="29"  y="86" width="59" height="15"  fill="url(#gloss)" rx="1.5"/>
    <rect x="95"  y="30"  width="36" height="13" fill="url(#gloss)" rx="1.5"/>
    <rect x="108" y="43"  width="10" height="114" fill="url(#gloss)" rx="1.5"/>
    <rect x="95"  y="157" width="36" height="13" fill="url(#gloss)" rx="1.5"/>
    <rect x="139" y="30"  width="84" height="13" fill="url(#gloss)" rx="1.5"/>
    <rect x="174" y="43"  width="14" height="127" fill="url(#gloss)" rx="1.5"/>
  </g>

  <!-- OVERLAY TRACES — darker, cross letters -->
  <g clip-path="url(#iconClip)" opacity="0.7">
    <polyline id="o1" class="trace" points="0,55   14,55   29,70   60,70   75,55   90,55"/>
    <polyline id="o2" class="trace" points="108,0   108,43   113,48   113,86   108,91   108,157   108,200"/>
    <polyline id="o3" class="trace" points="139,37   181,37   181,30   181,43   181,170"/>
    <polyline id="o4" class="trace" points="155,200  155,180  174,161  174,43"/>
    <polyline id="o5" class="trace" points="88,0  88,20  73,35  73,80"/>
    <polyline id="o6" class="trace" points="0,115  14,115  30,115  55,115  70,115  95,115  131,115  139,115  160,115  188,115  210,115  242,115"/>
    <circle class="node n16" cx="14"  cy="55"  r="2.5" fill="#3a1a06"/>
    <circle class="node n17" cx="75"  cy="55"  r="2.5" fill="#3a1a06"/>
    <circle class="node n18" cx="108" cy="43"  r="2"   fill="#3a1a06"/>
    <circle class="node n19" cx="181" cy="37"  r="2.5" fill="#3a1a06"/>
    <circle class="node n20" cx="113" cy="115" r="2"   fill="#3a1a06"/>
  </g>

  <!-- SOLUTIONS -->
  <text class="solutions" x="15" y="192" fill="#a05818"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="15" letter-spacing="4.5">SOLUTIONS</text>

  <!-- DIVIDER -->
  <rect class="divider" x="242" y="0" width="1.5" height="200" fill="#3d2008"/>

  <!-- BINARY -->
  <text class="bin bin1"  x="247" y="17" >10110010</text>
  <text class="bin bin2"  x="247" y="29" >01001101</text>
  <text class="bin bin3"  x="247" y="41" >11010011</text>
  <text class="bin bin4"  x="247" y="53" >00101110</text>
  <text class="bin bin5"  x="247" y="65" >10011001</text>
  <text class="bin bin6"  x="247" y="77" >01100111</text>
  <text class="bin bin7"  x="247" y="89" >11100010</text>
  <text class="bin bin8"  x="247" y="101">00010110</text>
  <text class="bin bin9"  x="247" y="113">10101001</text>
  <text class="bin bin10" x="247" y="125">01110100</text>
  <text class="bin bin11" x="247" y="137">11001011</text>
  <text class="bin bin12" x="247" y="149">00111000</text>
  <text class="bin bin13" x="247" y="161">10000101</text>
  <text class="bin bin14" x="247" y="173">01011010</text>
  <text class="bin bin15" x="247" y="185">11110001</text>
  <text class="bin bin16" x="247" y="197">00100111</text>

  <!-- RIGHT TEXT -->
  <text class="rtext1" x="268" y="82"  fill="#b06828"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="13" letter-spacing="2">Hannant</text>
  <text class="rtext2" x="268" y="102" fill="#905018"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="13" letter-spacing="2">Information</text>
  <text class="rtext3" x="268" y="122" fill="#905018"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="13" letter-spacing="2">Technology</text>
  <text class="rtext4" x="268" y="142" fill="#905018"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="13" letter-spacing="2">Solutions</text>
</svg>