/* ============================================================
   BASE STYLES
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: sans-serif;
}

.logo-wrap {
  background: var(--bg);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

svg {
  display: block;
}

/* ============================================================
   DOT GRID  (JS-drawn via canvas-pattern trick isn't needed —
   we use an SVG pattern that reads the CSS var via a rect)
   ============================================================ */

/* ============================================================
   TRACE ANIMATIONS
   ============================================================ */
.trace {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#t1 { stroke: var(--trace-mid);   stroke-width:2;   stroke-dasharray:320; stroke-dashoffset:320; animation: draw 1.2s ease forwards 0.2s; }
#t2 { stroke: var(--trace-light); stroke-width:1.8; stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.9s ease forwards 0.5s; }
#t3 { stroke: var(--trace-mid);   stroke-width:2;   stroke-dasharray:220; stroke-dashoffset:220; animation: draw 1.0s ease forwards 0.7s; }
#t4 { stroke: var(--trace-light); stroke-width:2;   stroke-dasharray:420; stroke-dashoffset:420; animation: draw 1.4s ease forwards 0.3s; }
#t5 { stroke: var(--trace-shine); stroke-width:1.8; stroke-dasharray:260; stroke-dashoffset:260; animation: draw 1.1s ease forwards 0.9s; }
#t6 { stroke: var(--trace-mid);   stroke-width:1.8; stroke-dasharray:380; stroke-dashoffset:380; animation: draw 1.3s ease forwards 0.6s; }
#t7 { stroke: var(--trace-light); stroke-width:2;   stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.8s ease forwards 1.1s; }
#t8 { stroke: var(--trace-shine); stroke-width:1.6; stroke-dasharray:120; stroke-dashoffset:120; animation: draw 0.7s ease forwards 1.3s; }
#t9 { stroke: var(--trace-mid);   stroke-width:1.8; stroke-dasharray:300; stroke-dashoffset:300; animation: draw 1.1s ease forwards 0.4s; }

#o1 { stroke: var(--overlay); stroke-width:2.0; stroke-dasharray:200; stroke-dashoffset:200; animation: draw 0.9s ease forwards 1.6s; }
#o2 { stroke: var(--overlay); stroke-width:1.8; stroke-dasharray:200; stroke-dashoffset:200; animation: draw 0.9s ease forwards 1.8s; }
#o3 { stroke: var(--overlay); stroke-width:1.8; stroke-dasharray:180; stroke-dashoffset:180; animation: draw 0.8s ease forwards 2.0s; }
#o4 { stroke: var(--overlay); stroke-width:1.7; stroke-dasharray:220; stroke-dashoffset:220; animation: draw 0.9s ease forwards 2.1s; }
#o5 { stroke: var(--overlay); stroke-width:1.8; stroke-dasharray:110; stroke-dashoffset:110; animation: draw 0.6s ease forwards 2.3s; }
#o6 { stroke: var(--overlay); stroke-width:1.7; stroke-dasharray:560; stroke-dashoffset:560; animation: draw 1.4s ease forwards 2.2s; }

.stub { stroke: var(--trace-mid); stroke-width:2.5; stroke-linecap:round; }
.stub-shine { stroke: var(--trace-shine); stroke-width:2.5; stroke-linecap:round; }

@keyframes draw { to { stroke-dashoffset: 0; } }

/* ============================================================
   NODE FADE-IN
   ============================================================ */
.node { opacity: 0; animation: fadeIn 0.3s ease forwards; }
.n1  { animation-delay: 1.35s; } .n2  { animation-delay: 1.40s; }
.n3  { animation-delay: 0.65s; } .n4  { animation-delay: 0.85s; }
.n5  { animation-delay: 1.05s; } .n6  { animation-delay: 0.75s; }
.n7  { animation-delay: 0.95s; } .n8  { animation-delay: 1.10s; }
.n9  { animation-delay: 0.50s; } .n10 { animation-delay: 1.25s; }
.n11 { animation-delay: 0.95s; } .n12 { animation-delay: 1.45s; }
.n13 { animation-delay: 1.25s; } .n14 { animation-delay: 1.50s; }
.n15 { animation-delay: 1.60s; } .n16 { animation-delay: 1.80s; }
.n17 { animation-delay: 2.10s; } .n18 { animation-delay: 2.20s; }
.n19 { animation-delay: 2.35s; } .n20 { animation-delay: 2.45s; }

@keyframes fadeIn { to { opacity: 1; } }

/* ============================================================
   LETTER REVEALS
   ============================================================ */
.letter    { opacity: 0; animation: fadeIn 0.5s ease forwards 1.5s; }
.solutions { opacity: 0; animation: fadeIn 0.6s ease forwards 2.6s; fill: var(--solutions); }
.rtext1    { opacity: 0; animation: slideIn 0.5s ease forwards 2.8s; fill: var(--rtext-1); }
.rtext2    { opacity: 0; animation: slideIn 0.5s ease forwards 3.0s; fill: var(--rtext-2); }
.rtext3    { opacity: 0; animation: slideIn 0.5s ease forwards 3.2s; fill: var(--rtext-2); }
.rtext4    { opacity: 0; animation: slideIn 0.5s ease forwards 3.4s; fill: var(--rtext-2); }
.divider   { opacity: 0; animation: fadeIn 0.4s ease forwards 2.5s;  fill: var(--divider); }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0);   }
}

/* ============================================================
   BINARY FLICKER
   ============================================================ */
.bin {
  font-family: monospace;
  font-size: 7px;
  letter-spacing: 1px;
  fill: var(--bin-base);
}
.bin1  { animation: blink 3.1s infinite 0.0s; }
.bin2  { animation: blink 2.7s infinite 0.4s; }
.bin3  { animation: blink 3.5s infinite 0.8s; }
.bin4  { animation: blink 2.3s infinite 0.2s; }
.bin5  { animation: blink 3.8s infinite 1.1s; }
.bin6  { animation: blink 2.9s infinite 0.6s; }
.bin7  { animation: blink 3.2s infinite 0.3s; }
.bin8  { animation: blink 2.6s infinite 0.9s; }
.bin9  { animation: blink 3.6s infinite 0.1s; }
.bin10 { animation: blink 2.4s infinite 0.7s; }
.bin11 { animation: blink 3.3s infinite 1.2s; }
.bin12 { animation: blink 2.8s infinite 0.5s; }
.bin13 { animation: blink 3.7s infinite 0.3s; }
.bin14 { animation: blink 2.5s infinite 1.0s; }
.bin15 { animation: blink 3.0s infinite 0.8s; }
.bin16 { animation: blink 2.2s infinite 0.2s; }

@keyframes blink {
  0%   { fill: var(--bin-base);  }
  45%  { fill: var(--bin-base);  }
  50%  { fill: var(--bin-flash); }
  52%  { fill: var(--bin-base);  }
  80%  { fill: var(--bin-base);  }
  85%  { fill: var(--bin-flash); opacity: 0.7; }
  87%  { fill: var(--bin-base);  }
  100% { fill: var(--bin-base);  }
}

/* ============================================================
   LETTER FILL HELPERS  (gradient stops can't use vars directly,
   so we use background + SVG foreignObject trick via filter)
   Instead: we drive fills with CSS on <rect> elements that
   have class-based fills referencing vars via inline style.
   The gradients are rebuilt via a JS snippet below.
   ============================================================ */
.letter-rect { fill: url(#letterGrad); }
.scanline-rect { fill: url(#scanlines); }
.gloss-rect { fill: url(#gloss); }

.node-circle {
  fill: var(--node-fill);
  stroke: var(--node-stroke);
}
.node-circle-shine {
  fill: var(--node-fill);
  stroke: var(--trace-shine);
}
.overlay-node { fill: var(--overlay); }

</style>

<script>
// Reads CSS custom properties and applies them to SVG elements
// that can't use var() directly (gradient stops, pattern fills, etc.)
function applyTheme() {
  const s = getComputedStyle(document.documentElement);
  const v = name => s.getPropertyValue(name).trim();

  // Background
  document.getElementById('main-bg').setAttribute('fill', v('--bg'));
  document.getElementById('dot-bg').setAttribute('fill', v('--bg'));
  document.getElementById('dot-circle').setAttribute('fill', v('--bg-dot'));

  // Letter gradient stops
  document.getElementById('lg-top').setAttribute('stop-color', v('--letter-top'));
  document.getElementById('lg-mid').setAttribute('stop-color', v('--letter-mid'));
  document.getElementById('lg-bot').setAttribute('stop-color', v('--letter-bot'));

  // Gloss stops
  const glossColor = v('--letter-gloss');
  ['gl-0','gl-35','gl-60','gl-100'].forEach(id =>
    document.getElementById(id).setAttribute('stop-color', glossColor)
  );

  // Scanline color
  document.getElementById('scan-line').setAttribute('stroke', v('--letter-scan'));
}

applyTheme();
</script>
</body>
</html>
