<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #183126; }
    .label { font: 600 16px Arial, sans-serif; fill: #183126; }
    .small { font: 400 13px Arial, sans-serif; fill: #4d5e56; }
    .box { fill: #ffffff; stroke: #2c5f2d; stroke-width: 2; rx: 14; }
    .group { fill: #edf7ed; stroke: #2c5f2d; stroke-width: 2; rx: 16; }
    .line { stroke: #7f9389; stroke-width: 2; }
  </style>

  <rect width="1200" height="780" fill="#f7f8f5" />
  <text x="40" y="48" class="title">Root Navigation Layout</text>

  <rect x="470" y="80" width="260" height="74" class="group" />
  <text x="600" y="112" text-anchor="middle" class="label">app/_layout.tsx</text>
  <text x="600" y="136" text-anchor="middle" class="small">Root Stack</text>

  <line x1="600" y1="154" x2="600" y2="200" class="line" />

  <rect x="55" y="220" width="140" height="64" class="box" />
  <text x="125" y="247" text-anchor="middle" class="label">/</text>
  <text x="125" y="268" text-anchor="middle" class="small">index.tsx</text>

  <rect x="215" y="220" width="140" height="64" class="box" />
  <text x="285" y="247" text-anchor="middle" class="label">/login</text>
  <text x="285" y="268" text-anchor="middle" class="small">login.tsx</text>

  <rect x="375" y="220" width="140" height="64" class="box" />
  <text x="445" y="247" text-anchor="middle" class="label">/register</text>
  <text x="445" y="268" text-anchor="middle" class="small">register.tsx</text>

  <rect x="535" y="220" width="160" height="64" class="box" />
  <text x="615" y="247" text-anchor="middle" class="label">/privacy-policy</text>
  <text x="615" y="268" text-anchor="middle" class="small">privacy-policy.tsx</text>

  <rect x="715" y="220" width="180" height="64" class="box" />
  <text x="805" y="247" text-anchor="middle" class="label">/terms-of-service</text>
  <text x="805" y="268" text-anchor="middle" class="small">terms-of-service.tsx</text>

  <rect x="915" y="220" width="210" height="64" class="box" />
  <text x="1020" y="247" text-anchor="middle" class="label">/property_filters</text>
  <text x="1020" y="268" text-anchor="middle" class="small">property_filters.tsx</text>

  <line x1="600" y1="200" x2="125" y2="220" class="line" />
  <line x1="600" y1="200" x2="285" y2="220" class="line" />
  <line x1="600" y1="200" x2="445" y2="220" class="line" />
  <line x1="600" y1="200" x2="615" y2="220" class="line" />
  <line x1="600" y1="200" x2="805" y2="220" class="line" />
  <line x1="600" y1="200" x2="1020" y2="220" class="line" />

  <rect x="180" y="380" width="220" height="108" class="group" />
  <text x="290" y="414" text-anchor="middle" class="label">(tabs) group</text>
  <text x="290" y="438" text-anchor="middle" class="small">public tab layout</text>
  <text x="290" y="464" text-anchor="middle" class="small">/, /map, /team, /dashboard*</text>

  <rect x="460" y="380" width="220" height="108" class="group" />
  <text x="570" y="414" text-anchor="middle" class="label">(shared_screens)</text>
  <text x="570" y="438" text-anchor="middle" class="small">ProtectedRoute</text>
  <text x="570" y="464" text-anchor="middle" class="small">sell-home and details flows</text>

  <rect x="740" y="380" width="140" height="108" class="group" />
  <text x="810" y="414" text-anchor="middle" class="label">client</text>
  <text x="810" y="438" text-anchor="middle" class="small">client stack</text>

  <rect x="920" y="380" width="140" height="108" class="group" />
  <text x="990" y="414" text-anchor="middle" class="label">agent</text>
  <text x="990" y="438" text-anchor="middle" class="small">agent stack</text>

  <rect x="1080" y="380" width="90" height="108" class="group" />
  <text x="1125" y="414" text-anchor="middle" class="label">admin</text>
  <text x="1125" y="438" text-anchor="middle" class="small">admin</text>

  <line x1="600" y1="154" x2="290" y2="380" class="line" />
  <line x1="600" y1="154" x2="570" y2="380" class="line" />
  <line x1="600" y1="154" x2="810" y2="380" class="line" />
  <line x1="600" y1="154" x2="990" y2="380" class="line" />
  <line x1="600" y1="154" x2="1125" y2="380" class="line" />

  <rect x="370" y="560" width="460" height="120" fill="#fff4e5" stroke="#c77700" stroke-width="2" rx="16" />
  <text x="600" y="594" text-anchor="middle" class="label">Note</text>
  <text x="600" y="622" text-anchor="middle" class="small">Group names organize files but are not part of the public URL.</text>
  <text x="600" y="646" text-anchor="middle" class="small">Example: app/(shared_screens)/sell-home/index.tsx is reached as /sell-home.</text>
</svg>
